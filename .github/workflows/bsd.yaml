# host_constraints_test を BSD で回す。
#
# この枝の変更が正しいことは「NetBSD で @platforms//host が os:netbsd を
# 返す」で示される。NetBSD の binary set には bazel 6.4.0 が在り、この
# module は bzlmod を立てればそれで解ける。当て物なしなら
#
#	actual   ["@platforms//cpu:x86_64"]
#	expected ["@platforms//cpu:x86_64", "@platforms//os:netbsd"]
#
# で落ち、当てれば通る。FreeBSD と OpenBSD も、その OS の bazel で同じ
# ことを見る。
#
# DragonFly も同じ形で見る。dports の binary にあるのは bazel5-5.4.1 だけ
# だが、bzlmod は 5.0 から --experimental_enable_bzlmod で使える。依存の
# package_metadata / rules_license / rules_shell はどれも bazel の下限を
# 切っていないので、graph は解けるはずである。
name: BSD

on:
  push:
    paths: &bsd_paths
      - 'host/**'
      - 'os/**'
      - 'cpu/**'
      - 'tests/**'
      - 'MODULE.bazel'
      - '.github/workflows/bsd.yaml'
  pull_request:
    paths: *bsd_paths
  workflow_dispatch:

# head_ref を先に見ないと、push の ref と pull_request の ref が別物になって
# 同じ枝で二重に走る。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            pkg install -y bazel9 openjdk21 bash python3 curl
          run: |
            set -e
            export JAVA_HOME=/usr/local/openjdk21
            # テストは repr を文字列で比べるので引用符まで一致させる。
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:freebsd"]'
            bazel --output_user_root=/tmp/bazel \
              test //tests/host:host_constraints_test \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          usesh: true
          mem: 4096
          copyback: false
          prepare: |
            set -e
            /usr/sbin/pkg_add -U pkgin
            # pkgsrc の openjdk21 は base の X11 に link されていて、
            # /usr/X11R7/lib/libX11.so.7 などが要る。vmactions の image は
            # X の set を入れていないので、pkgin がそこで蹴る。
            #
            #   /usr/X11R7/lib/libX11.so.7, needed by openjdk21-... is not
            #   present in this system.
            #
            # pkgsrc 側の libX11 を入れても /usr/pkg/lib に置かれるだけで
            # /usr/X11R7 は埋まらない。base の set を展開する。6.6MB。
            ftp -o /tmp/xbase.tar.xz \
              https://cdn.NetBSD.org/pub/NetBSD/NetBSD-$(uname -r)/$(uname -m)/binary/sets/xbase.tar.xz
            xz -dc /tmp/xbase.tar.xz | tar -xpf - -C /
            rm /tmp/xbase.tar.xz
            pkgin -y install bazel openjdk21
          run: |
            set -e
            export JAVA_HOME=/usr/pkg/java/openjdk21
            export PATH=/usr/pkg/bin:$PATH
            # テストは repr を文字列で比べるので引用符まで一致させる。
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:netbsd"]'
            # pkgsrc の bazel は 6.4.0 なので bzlmod は明示して立てる。
            bazel --output_user_root=/var/tmp/bazel \
              test //tests/host:host_constraints_test \
              --enable_bzlmod \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          mem: 4096
          copyback: false
          prepare: |
            pkg_add -I bazel jdk%21 bash
            # bazel が展開する tools/test/*.sh は #!/bin/bash で始まる。
            # OpenBSD の bash は ports なので /usr/local/bin/bash にしか
            # なく、そのままだと test wrapper も generate-xml.sh も
            # exit 127 (実行するものが無い) で落ちる。
            ln -sf /usr/local/bin/bash /bin/bash
          run: |
            set -e
            export JAVA_HOME=$(ls -d /usr/local/jdk-21* | head -1)
            # テストは repr を文字列で比べるので引用符まで一致させる。
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:openbsd"]'
            # devel/bazel は 6.5.0 なので bzlmod は明示して立てる。
            bazel --output_user_root=/tmp/bazel \
              test //tests/host:host_constraints_test \
              --enable_bzlmod \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures

  dragonfly:
    name: DragonFly BSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          mem: 4096
          copyback: false
          prepare: |
            pkg install -y bazel5
          run: |
            set -e
            # bazel5 が入れる名前は port によって bazel とも bazel5 とも
            # なるので、決め打ちせず shell に引かせる。
            BAZEL=$(command -v bazel || command -v bazel5)
            # bazel5 の依存は openjdk11 で、openjdk21 ではない。
            export JAVA_HOME=$(ls -d /usr/local/openjdk11 | head -1)
            "$JAVA_HOME/bin/java" -version
            df -h /tmp
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:dragonfly"]'
            # 5.4.1 の bzlmod はまだ experimental の名前のまま。
            #
            # server が 120 秒で立たずに落ちても、client 側には理由が出て
            # こない。JVM の側の出力を拾わないと何も分からないので、
            # 落ちたら jvm.out を出してから終わる。
            "$BAZEL" --output_user_root=/tmp/bazel \
              test //tests/host:host_constraints_test \
              --experimental_enable_bzlmod \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures || {
                echo "===== jvm.out ====="
                find /tmp/bazel -name 'jvm.out*' -exec cat {} + 2>/dev/null || true
                exit 1
              }
