# host_constraints_test を BSD で回す。
#
# この枝の変更が正しいことは「NetBSD で @platforms//host が os:netbsd を
# 返す」で示される。NetBSD の binary set には bazel 6.4.0 が在り、この
# module は bzlmod を立てればそれで解ける。当て物なしなら
#
#	actual   ["@platforms//cpu:x86_64"]
#	expected ["@platforms//cpu:x86_64", "@platforms//os:netbsd"]
#
# で落ち、当てれば通る。FreeBSD と OpenBSD も、その OS の bazel で同じ
# ことを見る。
#
# DragonFly は dports の bazel では回せない。binary にあるのは
# bazel5-5.4.1 だけで、bzlmod こそ 5.0 から使えるものの、この module が
# 引く rules_shell 0.6.1 が Bazel 6 の Starlark を要求する。
#
#	rules_shell.0.6.1/shell/sh_test.bzl:19:1:
#	    name 'visibility' is not defined
#
# graph は解ける。BCR から rules_shell も取ってくる。落ちるのはその先の
# 読み込みで、どの依存も bazel_compatibility を書いていないので、下限を
# 宣言していないことは動く根拠にならなかった。
#
# 併せて、5.4.1 の server は DragonFly で serve に進まない。port は bind
# されて command_port も書かれ、client も TCP では繋がるが、accept された
# まま読まれず CLOSE_WAIT で残り、900 秒待っても同じだった。--batch なら
# 避けられるが、上の visibility() には効かない。
#
# 動かすには pkgsrc を bootstrap して devel/bazel 6.4.0 を入れるしかない。
# それまでこの job は置かない。
name: BSD

on:
  push:
    paths: &bsd_paths
      - 'host/**'
      - 'os/**'
      - 'cpu/**'
      - 'tests/**'
      - 'MODULE.bazel'
      - '.github/workflows/bsd.yaml'
  pull_request:
    paths: *bsd_paths
  workflow_dispatch:
    inputs:
      only:
        description: '回す OS をコンマ区切りで (freebsd,netbsd,openbsd,dragonfly)。空なら全部'
        default: ''

# head_ref を先に見ないと、push の ref と pull_request の ref が別物になって
# 同じ枝で二重に走る。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD
    # only が空なら (push と pull_request は必ず空) 全部回す。
    # 手で回すときだけ、まだ通っていないものに絞れる。
    if: ${{ github.event.inputs.only == '' || contains(format(',{0},', github.event.inputs.only), ',freebsd,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            pkg install -y bazel9 openjdk21 bash python3 curl
          run: |
            set -e
            export JAVA_HOME=/usr/local/openjdk21
            # テストは repr を文字列で比べるので引用符まで一致させる。
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:freebsd"]'
            bazel --output_user_root=/tmp/bazel \
              test //tests/host:host_constraints_test \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures

  netbsd:
    name: NetBSD
    # only が空なら (push と pull_request は必ず空) 全部回す。
    # 手で回すときだけ、まだ通っていないものに絞れる。
    if: ${{ github.event.inputs.only == '' || contains(format(',{0},', github.event.inputs.only), ',netbsd,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          usesh: true
          mem: 4096
          copyback: false
          prepare: |
            set -e
            # 既定の ftp.netbsd.org と cdn.NetBSD.org はどちらも落ちる。
            # 実際、この job は両方 Connection refused で二度落ちた。JAIST は
            # pkgsrc の binary を持っていて、そこは生きていた。
            PKG_PATH=https://ftp.jaist.ac.jp/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r)/All
            export PKG_PATH
            /usr/sbin/pkg_add -U pkgin
            # pkgin は PKG_PATH ではなく自分の設定を見るので、そちらにも書く。
            echo "$PKG_PATH" > /usr/pkg/etc/pkgin/repositories.conf
            pkgin -y update
            # pkgsrc の openjdk21 は base の X11 に link されていて、
            # /usr/X11R7/lib/libX11.so.7 などが要る。vmactions の image は
            # X の set を入れていないので、pkgin がそこで蹴る。
            #
            #   /usr/X11R7/lib/libX11.so.7, needed by openjdk21-... is not
            #   present in this system.
            #
            # pkgsrc 側の libX11 を入れても /usr/pkg/lib に置かれるだけで
            # /usr/X11R7 は埋まらない。base の set を展開する。6.6MB。
            ftp -o /tmp/xbase.tar.xz \
              https://ftp.jaist.ac.jp/pub/NetBSD/NetBSD-$(uname -r)/$(uname -m)/binary/sets/xbase.tar.xz
            xz -dc /tmp/xbase.tar.xz | tar -xpf - -C /
            rm /tmp/xbase.tar.xz
            pkgin -y install bazel openjdk21
          run: |
            set -e
            export JAVA_HOME=/usr/pkg/java/openjdk21
            export PATH=/usr/pkg/bin:$PATH
            # テストは repr を文字列で比べるので引用符まで一致させる。
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:netbsd"]'
            # pkgsrc の bazel は 6.4.0 なので bzlmod は明示して立てる。
            bazel --output_user_root=/var/tmp/bazel \
              test //tests/host:host_constraints_test \
              --enable_bzlmod \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures

  openbsd:
    name: OpenBSD
    # only が空なら (push と pull_request は必ず空) 全部回す。
    # 手で回すときだけ、まだ通っていないものに絞れる。
    if: ${{ github.event.inputs.only == '' || contains(format(',{0},', github.event.inputs.only), ',openbsd,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          mem: 4096
          copyback: false
          prepare: |
            pkg_add -I bazel jdk%21 bash
            # bazel が展開する tools/test/*.sh は #!/bin/bash で始まる。
            # OpenBSD の bash は ports なので /usr/local/bin/bash にしか
            # なく、そのままだと test wrapper も generate-xml.sh も
            # exit 127 (実行するものが無い) で落ちる。
            ln -sf /usr/local/bin/bash /bin/bash
          run: |
            set -e
            export JAVA_HOME=$(ls -d /usr/local/jdk-21* | head -1)
            # テストは repr を文字列で比べるので引用符まで一致させる。
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:openbsd"]'
            # devel/bazel は 6.5.0 なので bzlmod は明示して立てる。
            bazel --output_user_root=/tmp/bazel \
              test //tests/host:host_constraints_test \
              --enable_bzlmod \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures

  dragonfly:
    name: DragonFly BSD
    # only が空なら (push と pull_request は必ず空) 全部回す。
    # 手で回すときだけ、まだ通っていないものに絞れる。
    if: ${{ github.event.inputs.only == '' || contains(format(',{0},', github.event.inputs.only), ',dragonfly,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          mem: 4096
          copyback: false
          prepare: |
            pkg install -y bazel5
          run: |
            set -e
            # bazel5 が入れる名前は port によって bazel とも bazel5 とも
            # なるので、決め打ちせず shell に引かせる。
            # DragonFly では JVM が既定の data 上限に当たって
            #
            #	Native memory allocation (mmap) failed to map 65536 bytes.
            #	Error detail: Failed to commit metaspace.
            #
            # で数秒で死ぬ。client 側はそれを見られないので、120 秒待って
            # 「server に繋がらない」とだけ言って終わる。物理も swap も
            # 余っていて、効いているのは ulimit の方である。
            ulimit -d unlimited 2>/dev/null || true
            ulimit -n unlimited 2>/dev/null || ulimit -n 4096 2>/dev/null || true
            BAZEL=$(command -v bazel || command -v bazel5)
            # bazel5 の依存は openjdk11 で、openjdk21 ではない。
            export JAVA_HOME=$(ls -d /usr/local/openjdk11 | head -1)
            "$JAVA_HOME/bin/java" -version
            df -h /tmp
            export EXPECTED_HOST_CONSTRAINTS='["@platforms//cpu:x86_64", "@platforms//os:dragonfly"]'
            # 5.4.1 の bzlmod はまだ experimental の名前のまま。
            #
            # server が 120 秒で立たずに落ちても、client 側には理由が出て
            # こない。JVM の側の出力を拾わないと何も分からないので、
            # 落ちたら jvm.out を出してから終わる。
            "$BAZEL" --output_user_root=/tmp/bazel \
              test //tests/host:host_constraints_test \
              --experimental_enable_bzlmod \
              --test_output=all \
              --test_env=EXPECTED_HOST_CONSTRAINTS \
              --verbose_failures || {
                echo "===== jvm.out ====="
                find /tmp/bazel -name 'jvm.out*' -exec cat {} + 2>/dev/null || true
                exit 1
              }
